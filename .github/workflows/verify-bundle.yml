name: Verify presentation bundle

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify PPTX bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Self-test the verifier and importer
        run: node tools/selftest.mjs

      - name: Verify every deck and its checksums
        run: node tools/pptx-bundle.mjs verify

      - name: Fail if the recorded manifest is stale
        run: node tools/pptx-bundle.mjs manifest --check
